name: MVP-Demo veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Demo erstellen
        shell: bash
        run: |
          mkdir -p _site build/pro-ocean-van
          cp -R pro-ocean-van.php uninstall.php readme.txt src templates assets build/pro-ocean-van/
          PLUGIN_ARCHIVE="pro-ocean-van-${GITHUB_SHA}.zip"
          cd build
          zip -qr "../_site/${PLUGIN_ARCHIVE}" pro-ocean-van
          cd ..
          sed "s|__POV_PLUGIN_URL__|https://maxreih.github.io/pro-ocean-van-mvp/${PLUGIN_ARCHIVE}|g" \
            playground/blueprint.template.json > _site/blueprint.json
          cp playground/index.html _site/index.html
          cp assets/brand/pro-ocean-symbol-blue.svg _site/pro-ocean-symbol-blue.svg

      - name: Demo-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
